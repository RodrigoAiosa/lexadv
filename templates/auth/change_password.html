{% extends "base.html" %}
{% block title %}Alterar senha — LEX{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow">
    <div class="card form-card">
      <h1>Alterar senha</h1>
      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="field">
          <span>Senha atual</span>
          <input type="password" name="current_password" autocomplete="current-password" required autofocus>
        </label>
        <label class="field">
          <span>Nova senha</span>
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
          <small class="muted">Mínimo de 8 caracteres.</small>
        </label>
        <label class="field">
          <span>Confirmar nova senha</span>
          <input type="password" name="password_confirm" autocomplete="new-password" minlength="8" required>
        </label>
        <button class="btn btn--navy btn--block" type="submit">Salvar nova senha</button>
      </form>
      <p class="muted center">Esqueceu a senha atual? Saia da conta e use "Esqueci minha senha" no login.</p>
    </div>
  </div>
</section>
{% endblock %}
