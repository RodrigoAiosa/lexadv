{% extends "base.html" %}
{% block title %}Nova senha — LEX{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow">
    <div class="card form-card">
      <h1>Criar nova senha</h1>
      <div class="notice notice--warning" id="reset-invalid" hidden>
        <p id="reset-invalid-msg">Link inválido ou expirado.</p>
        <p><a class="btn btn--navy btn--sm" href="{{ url_for('auth.forgot_password') }}">Pedir novo link</a></p>
      </div>
      <form method="post" id="reset-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="access_token" id="access_token" value="{{ token or '' }}">
        <label class="field">
          <span>Nova senha</span>
          <input type="password" name="password" autocomplete="new-password" minlength="8" required autofocus>
          <small class="muted">Mínimo de 8 caracteres.</small>
        </label>
        <label class="field">
          <span>Confirmar nova senha</span>
          <input type="password" name="password_confirm" autocomplete="new-password" minlength="8" required>
        </label>
        <button class="btn btn--navy btn--block" type="submit">Salvar nova senha</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/reset.js') }}" defer></script>{% endblock %}
