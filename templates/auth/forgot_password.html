{% extends "base.html" %}
{% block title %}Recuperar senha — LEX{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow">
    <div class="card form-card">
      <h1>Recuperar senha</h1>
      <p class="muted">Informe o e-mail da sua conta e enviaremos um link para você criar uma nova senha.</p>
      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="field">
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="email" inputmode="email" maxlength="254"
                 placeholder="nome@dominio.com.br" value="{{ email }}" required autofocus>
        </label>
        <button class="btn btn--navy btn--block" type="submit">Enviar link</button>
      </form>
      <p class="muted center"><a href="{{ url_for('auth.login') }}">Voltar para o login</a></p>
    </div>
  </div>
</section>
{% endblock %}
